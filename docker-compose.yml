version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: credit_lens_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: credit_lens
      MYSQL_USER: credit_lens_user
      MYSQL_PASSWORD: credit_lens_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
