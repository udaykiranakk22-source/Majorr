<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Lens icon -->
  <circle cx="22" cy="25" r="16" stroke="url(#logoGrad)" stroke-width="3" fill="none"/>
  <circle cx="22" cy="25" r="8" fill="url(#logoGrad)" opacity="0.2"/>
  <line x1="34" y1="37" x2="42" y2="45" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkmark inside lens -->
  <polyline points="15,25 20,30 29,20" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="50" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e40af">Credit</text>
  <text x="50" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3b82f6">Lens</text>
</svg>
